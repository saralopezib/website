const TAG_COLOR = { journey: '#2f4379', acquisition: '#5A7554', state: '#78716c', device: '#b07a4a', account: '#5A7554', industry: '#1f7a54', billing: '#03a649', keg: '#b07a4a', wait: '#8a6d3b', finalread: '#5A7554', closure: '#2f4379', retention: '#b07a4a', exitfee: '#8a6d3b' };

// =====================================================================
// STATE & NAVIGATION
// =====================================================================

const state = { journey: 'movein', stage: 0 };

function pad(n) { return String(n).padStart(2, '0'); }
function fmt(sec) { return `${pad(Math.floor(sec/3600))}:${pad(Math.floor((sec%3600)/60))}:${pad(sec%60)}`; }

function maxStage() { return JOURNEYS[state.journey].stages.length - 1; }
function go(i) { state.stage = Math.max(0, Math.min(maxStage(), i)); render(); }
function next() { state.stage = state.stage >= maxStage() ? 0 : state.stage + 1; render(); }
function back() { state.stage = Math.max(0, state.stage - 1); render(); }
function setJourney(j) { state.journey = j; state.stage = 0; render(); }

// =====================================================================
// REUSABLE PROTOTYPE-STYLE COMPONENTS
// =====================================================================

const card = (inner, extra='') => `<div style="background:#ffffff; border:1px solid #d6d3d1; border-radius:8px; box-shadow:0 0 6px 0 rgba(0,0,0,0.10); ${extra}">${inner}</div>`;

const browserChrome = (title='Kaluza · agent workspace') => `<div style="display:flex; align-items:center; gap:8px; padding:9px 14px; background:#fafaf9; border-bottom:1px solid #d6d3d1;">
  <div style="display:flex; gap:5px;"><span style="width:9px; height:9px; border-radius:50%; background:#d6d3d1;"></span><span style="width:9px; height:9px; border-radius:50%; background:#d6d3d1;"></span><span style="width:9px; height:9px; border-radius:50%; background:#d6d3d1;"></span></div>
  <div style="font-size:11px; font-weight:500; color:#78716c; margin-left:4px;">${title}</div>
  <span class="ms" style="margin-left:auto; font-size:16px; color:#a8a29e;">support_agent</span>
</div>`;

const summaryItem = (label, value) => `<div><div style="font-size:11px; font-weight:600; color:#292524;">${label}</div><div style="font-size:11px; color:#57534e; margin-top:1px;">${value}</div></div>`;

const fuelCard = (opts = {}) => {
  const elec = ACCOUNT;
  const meterStatusLabel = opts.meterStatusLabel || 'Meter status';
  const siteStatusBadge = opts.siteStatus || `<span style="display:inline-block; padding:2px 8px; border-radius:99px; background:#fcf3f5; color:#d40c3c; font-size:10px; font-weight:600;">De-energised</span>`;
  const supplyItems = [
    summaryItem(elec.identifierLabel, elec.identifier),
    summaryItem('Region', elec.region),
    summaryItem('Supply address', elec.supplyAddress),
    summaryItem('Postcode', elec.postcode),
    summaryItem('Retailer start', elec.retailerStartDate),
  ];
  if (!opts.hideSiteStatus) supplyItems.push(summaryItem('Site status', siteStatusBadge));
  return `<section style="padding:14px 16px;">
    <header style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <span class="ms" style="font-size:18px; color:#292524;">bolt</span>
      <h2 style="font-size:14px; font-weight:700; color:#292524; margin:0;">Electricity</h2>
    </header>
    <div style="font-size:11px; font-weight:700; color:#292524; margin-bottom:9px; letter-spacing:-0.005em;">Supply details</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px 14px;">
      ${supplyItems.join('')}
    </div>
    <div style="border-top:1px solid #f1eee9; margin:14px 0 12px;"></div>
    <div style="font-size:11px; font-weight:700; color:#292524; margin-bottom:9px; letter-spacing:-0.005em;">Meter details</div>
    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px 14px;">
      ${summaryItem('MSN', elec.meterMsn)}
      ${summaryItem('Type', elec.meterType)}
      ${summaryItem(meterStatusLabel, `<span style="color:#03a649; font-weight:600;">Active</span>`)}
    </div>
  </section>`;
};

const primaryBtn = (label) => `<div style="display:inline-flex; align-items:center; padding:8px 16px; border-radius:4px; background:#2f4379; color:#fff; font-size:12px; font-weight:600;">${label}</div>`;

const secondaryBtn = (label) => `<div style="display:inline-flex; align-items:center; padding:8px 16px; border-radius:4px; background:#fff; color:#2f4379; border:1px solid #2f4379; font-size:12px; font-weight:600;">${label}</div>`;

const notification = (kind, title, body) => {
  const bg = kind === 'success' ? '#f0fff6' : '#fcf3f5';
  const fg = kind === 'success' ? '#03a649' : '#d40c3c';
  const icon = kind === 'success' ? 'check_circle' : 'error';
  return `<div style="display:flex; align-items:flex-start; gap:9px; padding:11px 13px; border-radius:4px; background:${bg}; border-left:4px solid ${fg};">
    <span class="ms ms-fill" style="font-size:18px; color:${fg};">${icon}</span>
    <div><div style="font-size:12px; font-weight:600; color:#292524;">${title}</div>${body?`<div style="font-size:11px; color:#57534e; margin-top:2px;">${body}</div>`:''}</div>
  </div>`;
};

const field = (label, value, hint) => `<div style="margin-bottom:10px;">
  <div style="font-size:10px; font-weight:600; color:#292524; margin-bottom:3px;">${label}</div>
  <div style="padding:7px 9px; border:1px solid #d6d3d1; border-radius:4px; font-size:11px; color:#292524; background:#fff;">${value}</div>
  ${hint?`<div style="font-size:10px; color:#78716c; margin-top:3px;">${hint}</div>`:''}
</div>`;

const radioInline = (label, options, selected) => `<div style="margin-bottom:10px;">
  <div style="font-size:10px; font-weight:600; color:#292524; margin-bottom:5px;">${label}</div>
  <div style="display:flex; gap:14px;">
    ${options.map(o => `<div style="display:flex; align-items:center; gap:5px; font-size:11px; color:#292524;"><span style="width:13px; height:13px; border-radius:50%; border:2px solid ${o===selected?'#2f4379':'#d6d3d1'}; display:inline-flex; align-items:center; justify-content:center;">${o===selected?'<span style="width:6px; height:6px; border-radius:50%; background:#2f4379;"></span>':''}</span>${o}</div>`).join('')}
  </div>
</div>`;

const sectionTitle = (t) => `<div style="font-size:13px; font-weight:700; color:#292524; margin:0 0 9px;">${t}</div>`;

const breadcrumb = (...crumbs) => `<div style="display:flex; align-items:center; gap:6px; font-size:11px; color:#78716c; margin-bottom:10px;">
  ${crumbs.map((c,i)=>`${i>0?'<span class="ms" style="font-size:13px; color:#a8a29e;">chevron_right</span>':''}<span style="${i===crumbs.length-1?'color:#292524; font-weight:500;':''}">${c}</span>`).join('')}
</div>`;

            <span style="color:#57534e;">Supply charge</span><span style="color:#292524; font-weight:600;">$20.20</span>

function serviceNode(svc) {
  const lvl = svc.lvl;
  const active = lvl >= 2;
  const iconBg = active ? '#eef2fa' : '#f5f5f4';
  const iconFg = active ? '#2f4379' : '#a8a29e';
  const opacity = lvl === 0 ? '0.55' : '1';
  let pill = '';
  if (lvl === 0) pill = `<span style="display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; background:#f5f5f4; font-size:10.5px; font-weight:500; color:#78716c; white-space:nowrap;"><span style="width:6px; height:6px; border-radius:50%; background:#d6d3d1;"></span>Idle</span>`;
  else if (lvl === 1) pill = `<span style="display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; background:#fff7e6; font-size:10.5px; font-weight:600; color:#8a6d3b; white-space:nowrap;"><span style="width:6px; height:6px; border-radius:50%; background:#cdbaa4;"></span>Queued</span>`;
  else if (lvl === 2) pill = `<span style="display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; background:#eef2fa; font-size:10.5px; font-weight:600; color:#2f4379; white-space:nowrap;"><span style="width:6px; height:6px; border-radius:50%; background:#2f4379; animation:kzpulse 1.1s ease-in-out infinite;"></span>Processing</span>`;
  else pill = `<span style="display:inline-flex; align-items:center; gap:4px; padding:3px 9px 3px 7px; border-radius:99px; background:#f0fff6; font-size:10.5px; font-weight:600; color:#03a649; white-space:nowrap;"><span class="ms ms-fill" style="font-size:13px; color:#03a649;">check_circle</span>Confirmed</span>`;
  return `<div style="display:flex; flex-direction:column; gap:7px; padding:13px 15px; background:#ffffff; border:1px solid #d6d3d1; border-radius:16px; box-shadow:0 0 6px 0 rgba(0,0,0,0.06); transition:opacity .4s ease; opacity:${opacity};">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="flex:none; width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:${iconBg}; transition:background .4s ease;">
        <span class="ms" style="font-size:19px; color:${iconFg}; transition:color .4s ease;">${svc.icon}</span>
      </div>
      <div style="font-weight:700; font-size:13px; color:#292524; line-height:1.2; letter-spacing:-0.01em;">${svc.label}</div>
      <div style="margin-left:auto; flex:none;">${pill}</div>
    </div>
    <div style="font-weight:400; font-size:11.5px; color:#57534e; line-height:1.4; padding-left:44px; min-height:16px;">${svc.msg}</div>
  </div>`;
}

function render() {
  const journey = JOURNEYS[state.journey];
  const STAGES = journey.stages;
  const SERVICES = journey.services;
  const s = state.stage;
  const cur = STAGES[s];
  const services = SERVICES.map(sv => ({ label: sv.name, icon: sv.icon, msg: sv.msgs[s], lvl: sv.levels[s] }));
  const confirmedCount = services.filter(x => x.lvl === 3).length;
  const processingCount = services.filter(x => x.lvl === 2).length;
  const queuedCount = services.filter(x => x.lvl === 1).length;
  // Weighted progress: confirmed = full, processing = half, queued = quarter
  const weightedPct = ((confirmedCount + processingCount * 0.5 + queuedCount * 0.25) / SERVICES.length * 100).toFixed(1) + '%';

    const isCur = i === s, isPast = i < s;

    <div style="width:1px; height:18px; background:rgba(30,30,30,0.12);"></div>
    <div style="font-size:11.5px; color:#78716C; font-weight:400;">Home moves journeys</div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:7px; background:#EAE3D8; border-radius:999px; padding:3px;">
      ${journeyKeys.map(k => `<button data-journey="${k}" style="${state.journey===k?segActive:segIdle}">${JOURNEYS[k].label}</button>`).join('')}
    </div>
  </header>`;

  const body = `<div style="display:flex; align-items:stretch; gap:8px; padding:44px 28px 24px; background:#F4EFE7; flex-wrap:wrap;">
        ${steps.map(st => `<div data-go="${st.i}" style="flex:1; min-width:158px; cursor:pointer; display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:11px; background:${st.bg}; border:1px solid ${st.border}; transition:background .3s ease, border-color .3s ease;">
          <div style="flex:none; width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; background:${st.numBg}; font-size:11px; font-weight:700; color:${st.numFg};">${st.numLabel}</div>
          <div style="font-size:12px; font-weight:600; color:${st.nameFg}; line-height:1.2;">${st.name}</div>
        </div>`).join('')}
      </div>
      <div style="flex:1; display:flex; flex-direction:column; padding:16px 28px 56px; gap:48px;">
        <div style="display:flex; align-items:flex-start; gap:16px;">
          <div style="flex:none; width:6px; align-self:stretch; border-radius:3px; background:#889E82;"></div>
          <div style="flex:1;">
            <div style="font-size:11px; font-weight:600; letter-spacing:0.08em; text-transform:uppercase; color:#5A7554; margin-bottom:6px;">Stage ${cur.num} · ${cur.name}</div>
            <div style="font-size:23px; font-weight:600; letter-spacing:-0.015em; line-height:1.18; margin-bottom:8px; max-width:780px; color:#1E1E1E;">${cur.headline}</div>
            <div style="font-size:13.5px; color:#5c564e; line-height:1.55; max-width:740px;">${cur.noSplit ? cur.note : cur.note.split(/\. (?=[A-Z])/).map((p,i,a)=>`${p}${i<a.length-1?'.<br>':''}`).join('')}</div>
          </div>
          <div style="flex:none; text-align:right; padding-left:12px; min-width:170px;">
            <div style="font-size:30px; font-weight:700; letter-spacing:-0.02em; color:#1E1E1E; line-height:1; font-variant-numeric:tabular-nums; transition:color .3s ease;">${confirmedCount}<span style="font-size:22px; font-weight:500; color:#a8a29e; letter-spacing:0;">&thinsp;/&thinsp;${SERVICES.length}</span></div>
            <div style="font-size:10px; color:#78716C; font-weight:600; letter-spacing:0.05em; text-transform:uppercase; margin-top:4px;">services confirmed</div>
            <div style="margin-top:10px; height:5px; border-radius:99px; background:rgba(30,30,30,0.08); overflow:hidden;"><div style="height:100%; width:${weightedPct}; background:#5A7554; border-radius:99px; transition:width .5s cubic-bezier(.4,0,.2,1);"></div></div>
            ${processingCount > 0 ? `<div style="font-size:10px; color:#5A7554; font-weight:600; margin-top:6px;">+${processingCount} processing</div>` : ''}
          </div>
        </div>
        <div style="display:grid; grid-template-columns:minmax(0,35fr) 60px minmax(0,65fr); gap:0; align-items:stretch;">
          <div style="display:flex; flex-direction:column; gap:10px; min-width:0;">
            <div style="display:flex; align-items:center; gap:7px;"><span class="ms" style="font-size:16px; color:#78716C;">desktop_windows</span><span style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#78716C;">Front-end · advisor</span></div>
            ${advisorScreen(state.journey, s)}
          </div>
          <div style="position:relative; display:flex; align-items:center; justify-content:center;">
            <div style="position:absolute; top:28px; bottom:0; left:50%; width:1px; background:rgba(30,30,30,0.12);"></div>
            <span class="ms" style="position:relative; z-index:1; font-size:26px; color:#889E82; background:#F4EFE7; padding:8px 4px; animation:kzflow 1.6s ease-in-out infinite;">chevron_right</span>
          </div>
          <div style="display:flex; flex-direction:column; gap:10px; min-width:0;">
            <div style="display:flex; align-items:center; gap:7px;"><span class="ms" style="font-size:16px; color:#78716C;">dns</span><span style="font-size:10.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:#78716C;">Back-end · Kaluza orchestration</span></div>
            <div style="flex:1; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start;">
              ${services.map(serviceNode).join('')}
            </div>
          </div>
        </div>
      </div>`;

  const footer = `<footer style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:13px 28px; background:#F9F6F3; border-top:1px solid rgba(30,30,30,0.08);">
    <button data-act="back" style="display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; background:transparent; border:1px solid rgba(30,30,30,0.16); color:${s===0?'#bcb5aa':'#44403C'};"><span class="ms" style="font-size:17px;">arrow_back</span>Back</button>
    <div style="display:flex; align-items:center; gap:8px;">
      ${dots.map(d => `<span style="width:${d.w}; height:8px; border-radius:99px; background:${d.bg}; transition:all .3s ease;"></span>`).join('')}
    </div>
    <button data-act="next" style="display:inline-flex; align-items:center; gap:7px; padding:10px 20px; border-radius:10px; border:none; cursor:pointer; background:#1E1E1E; color:#EEE8DF; font-size:13px; font-weight:600;">${s>=maxStage()?'Restart demo':'Next stage'}<span class="ms" style="font-size:18px;">${s>=maxStage()?'restart_alt':'arrow_forward'}</span></button>
  </footer>`;

  document.getElementById('app').innerHTML = header + `<div style="flex:1; display:flex; flex-direction:column; min-height:0;">${body}</div>` + footer;

  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => go(+el.dataset.go)));
  document.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', () => {
    const a = el.dataset.act;
    if (a === 'next') next();
    else if (a === 'back') back();
  }));
  document.querySelectorAll('[data-journey]').forEach(el => el.addEventListener('click', () => setJourney(el.dataset.journey)));
}

render();
</script>
</body>
</html>
